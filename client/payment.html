<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | SmartCanteen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">🍽️ SmartCanteen</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a class="active" href="cart.html">Cart <span id="cart-count" class="count">0</span></a>
      <a href="staff.html">Staff</a>
    </nav>
  </header>

  <main class="page-wrap narrow">
    <div class="page-title">
      <span class="eyebrow">ALMOST THERE</span>
      <h1>Checkout<span>.</span></h1>
      <p>Enter your details and choose how you want to pay.</p>
    </div>

    <form id="checkout-form" class="panel form-panel">
      <label for="customer-name">Your name</label>
      <input id="customer-name" required maxlength="50" placeholder="Enter your name">

      <label for="customer-email">Email address</label>
      <input id="customer-email" type="email" required placeholder="you@example.com">

      <div class="summary-box">
        <div class="summary-line"><span>Order total</span><strong id="checkout-total">₹0</strong></div>
      </div>

      <label>Payment method</label>
      <label class="radio-row">
        <input type="radio" name="payment" value="Pay at counter" checked> Pay at counter
      </label>
      <label class="radio-row" id="online-option" hidden>
        <input type="radio" name="payment" value="Pay online"> Pay online with Razorpay (UPI, cards, net banking)
      </label>

      <p class="notice">Online payments are handled by Razorpay. SmartCanteen never sees your card or UPI details.</p>
      <p id="checkout-error" class="form-error-text" role="alert"></p>

      <button class="btn full" type="submit">Confirm order →</button>
    </form>
  </main>

  <footer>© 2026 SmartCanteen</footer>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="script.js"></script>
</body>
</html>
