<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartCanteen | Menu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">🍴 SmartCanteen</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="index.html#about">About</a>
        <a href="staff.html">Staff</a>
    </div>

    <a href="cart.html" class="nav-btn">
        🛒 Cart <span id="cartCount">0</span>
    </a>

</nav>


<section class="menu-page">

    <div class="section-title">
        <p>SMARTCANTEEN MENU</p>
        <h1>Choose Your Favourite</h1>
    </div>


    <div class="menu-controls">

        <input
            type="text"
            id="searchBox"
            placeholder="Search food..."
            onkeyup="displayMenu()"
        >

        <select id="categoryFilter" onchange="displayMenu()">
            <option value="All">All Categories</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Snacks">Snacks</option>
            <option value="Meals">Meals</option>
            <option value="Beverages">Beverages</option>
            <option value="Desserts">Desserts</option>
        </select>

    </div>


    <div id="menuContainer" class="menu-grid"></div>

</section>


<footer>
    <h2>🍴 SmartCanteen</h2>
    <p>Smart food ordering for a smarter campus.</p>
</footer>


<script src="script.js"></script>

</body>
</html>
